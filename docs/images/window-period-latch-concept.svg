568) rotate(180)"></path><rect x="475.21275390625" y="584.8" width="509.5744921875" height="37.2" rx="5" fill="var(--white)" opacity="0.9"></rect><text x="730" y="608.92" class="t-body t-navy" text-anchor="middle"><tspan x="730" dy="0">snapshot = average over the whole period</tspan></text></g><g class="rb-box"><rect x="40" y="710" width="520" height="88.40000000000005" rx="10" class="box-warn"></rect><text x="300" y="744.72" class="t-body" text-anchor="middle"><tspan x="300" dy="0">First latch after begin() = primer,</tspan><tspan x="300" dy="32">discarded</tspan></text></g><g><path d="M420 710 L420 640" class="ln-warn"></path><path d="M0 0 L-14 -7 L-10.08 0 L-14 7 Z" class="ah-warn" transform="translate(420 640) rotate(-90)"></path></g></svg>