="1247" y="272.48" class="t-small t-muted" text-anchor="middle"><tspan x="1247" dy="0">stop</tspan></text><text x="40" y="328.48" class="t-small t-navy t-bold"><tspan x="40" dy="0">master → bus</tspan></text><g><path d="M240 322 L1300 322" class="ln-thin"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah" transform="translate(1300 322) rotate(0)"></path></g><g class="rb-box"><rect x="40" y="360" width="1320" height="113.24999999999996" rx="10" class="box"></rect><circle cx="62" cy="386.62" r="3.5" class="dot "></circle><text x="76" y="392.08000000000004" class="t-small t-ink"><tspan x="76" dy="0">address 0x00 is not a module — every module with GC enabled accepts the frame</tspan></text><circle cx="62" cy="416.77" r="3.5" class="dot "></circle><text x="76" y="422.23" class="t-small t-ink"><tspan x="76" dy="0">no reply on a General-Call: nothing to read back</tspan></text><circle cx="62" cy="446.91999999999996" r="3.5" class="dot "></circle><text x="76" y="452.38" class="t-small t-ink"><tspan x="76" dy="0">group byte: which modules act on the frame — see the initialization chapter</tspan></text></g></svg>