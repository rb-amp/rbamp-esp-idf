<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 671" width="1400" height="671" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Period sync across modules: sequential latch vs one General-Call frame</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Period sync across modules: sequential latch vs one General-Call frame</tspan></text><g class="rb-box"><rect x="40" y="130" width="640" height="500" rx="10" class="box-white"></rect></g><text x="60" y="168.88" class="t-h"><tspan x="60" dy="0">Sequential LATCH, one module at a time</tspan></text><text x="60" y="200.38" class="t-small t-ink"><tspan x="60" dy="0">three writes in turn → periods start a little apart (stagger)</tspan></text><text x="60" y="308.48" class="t-small t-navy t-bold t-mono"><tspan x="60" dy="0">0x50</tspan></text><rect x="140" y="300" width="280" height="34" class="box" rx="0"></rect><rect x="420" y="300" width="240" height="34" class="box-white" rx="0"></rect><text x="280" y="324.48" class="t-small t-muted" text-anchor="middle"><tspan x="280" dy="0">period N</tspan></text><text x="560" y="324.48" class="t-small t-navy" text-anchor="middle"><tspan x="560" dy="0">period N+1</tspan></text><g><path d="M420 284 L420 336" class="ln"></path></g><text x="60" y="400.48" class="t-small t-navy t-bold t-mono"><tspan x="60" dy="0">0x51</tspan></text><rect x="140" y="392" width="320" height="34" class="box" rx="0"></rect><rect x="460" y="392" width="200" height="34" class="box-white" rx="0"></rect><text x="300" y="416.48" class="t-small t-muted" text-anchor="middle"><tspan x="300" dy="0">period N</tspan></text><text x="580" y="416.48" class="t-small t-navy" text-anchor="middle"><tspan x="580" dy="0">period N+1</tspan></text><g><path d="M460 376 L460 428" class="ln"></path></g><text x="60" y="492.48" class="t-small t-navy t-bold t-mono"><tspan x="60" dy="0">0x52</tspan></text><rect x="140" y="484" width="360" height="34" class="box" rx="0"></rect><rect x="500" y="484" width="160" height="34" class="box-white" rx="0"></rect><text x="320" y="508.48" class="t-small t-muted" text-anchor="middle"><tspan x="320" dy="0">period N</tspan></text><text x="600" y="508.48" class="t-small t-navy" text-anchor="middle"><tspan x="600" dy="0">period N+1</tspan></text><g><path d="M500 468 L500 520" class="ln"></path></g><g><rect x="374.44410400390626" y="246.15" width="91.1117919921875" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="420" y="270.3" class="t-small t-navy t-bold t-mono" text-anchor="middle"><tspan x="420" dy="0">LATCH</tspan></text></g><g><rect x="414.44410400390626" y="338.15" width="91.1117919921875" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="460" y="362.3" class="t-small t-navy t-bold t-mono" text-anchor="middle"><tspan x="460" dy="0">LATCH</tspan></text></g><g><rect x="454.44410400390626" y="430.15" width="91.1117919921875" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="500" y="454.3" class="t-small t-navy t-bold t-mono" text-anchor="middle"><tspan x="500" dy="0">LATCH</tspan></text></g><g><path d="M420 572 L500 572" class="ln-thin"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah" transform="translate(500 572) rotate(0)"></path><path d="M0 0 L-13 -6.5 L-9.36 0 L-13 6.5 Z" class="ah" transform="translate(420 572) rotate(180)"></path></g><text x="460" y="602.48" class="t-small t-muted" text-anchor="middle"><tspan x="460" dy="0">stagger = write spacing</tspan></text><g class="rb-box"><rect x="720" y="130" width="640" height="500" rx="10" class="box-white"></rect></g><text x="740" y="168.88" class="t-h"><tspan x="740" dy="0">One General-Call frame at address 0x00</tspan></text><text x="740" y="200.38" class="t-small t-ink"><tspan x="740" dy="0">one write → every module with GC enabled latches on the</tspan><tspan x="740" dy="28">same frame</tspan></text><text x="740" y="308.48" class="t-small t-navy t-bold t-mono"><tspan x="740" dy="0">0x50</tspan></text><rect x="820" y="300" width="230" height="34" class="box" rx="0"></rect><rect x="1050" y="300" width="290" height="34" class="box-white" rx="0"></rect><text x="935" y="324.48" class="t-small t-muted" text-anchor="middle"><tspan x="935" dy="0">period N</tspan></text><text x="1215" y="324.48" class="t-small t-navy" text-anchor="middle"><tspan x="1215" dy="0">period N+1</tspan></text><g><path d="M1050 284 L1050 336" class="ln"></path></g><text x="740" y="400.48" class="t-small t-navy t-bold t-mono"><tspan x="740" dy="0">0x51</tspan></text><rect x="820" y="392" width="230" height="34" class="box" rx="0"></rect><rect x="1050" y="392" width="290" height="34" class="box-white" rx="0"></rect><text x="935" y="416.48" class="t-small t-muted" text-anchor="middle"><tspan x="935" dy="0">period N</tspan></text><text x="1215" y="416.48" class="t-small t-navy" text-anchor="middle"><tspan x="1215" dy="0">period N+1</tspan></text><g><path d="M1050 376 L1050 428" class="ln"></path></g><text x="740" y="492.48" class="t-small t-navy t-bold t-mono"><tspan x="740" dy="0">0x52</tspan></text><rect x="820" y="484" width="230" height="34" class="box" rx="0"></rect><rect x="1050" y="484" width="290" height="34" class="box-white" rx="0"></rect><text x="935" y="508.48" class="t-small t-muted" text-anchor="middle"><tspan x="935" dy="0">period N</tspan></text><text x="1215" y="508.48" class="t-small t-navy" text-anchor="middle"><tspan x="1215" dy="0">period N+1</tspan></text><g><path d="M1050 468 L1050 520" class="ln"></path></g><g><rect x="939.3323120117187" y="246.15" width="221.33537597656252" height="35.699999999999996" rx="17.849999999999998" class="box-mint"></rect><text x="1050" y="270.3" class="t-small t-navy t-bold t-mono" text-anchor="middle"><tspan x="1050" dy="0">GC frame @ 0x00</tspan