4" dy="0">Clamp ONE conductor</tspan><tspan x="1054" dy="32">— L only.</tspan></text></g><g class="rb-box"><rect x="1040" y="528.8" width="320" height="84.8" rx="10" class="box"></rect><text x="1054" y="561.8199999999999" class="t-body t-navy t-bold"><tspan x="1054" dy="0">Jack fully inserted;</tspan><tspan x="1054" dy="32">clamp closed.</tspan></text></g><g class="rb-box"><rect x="1040" y="627.5999999999999" width="320" height="116.8" rx="10" class="box"></rect><text x="1054" y="660.6199999999999" class="t-body t-navy t-bold"><tspan x="1054" dy="0">Wiring L/N and</tspan><tspan x="1054" dy="32">clamping inside a panel:</tspan><tspan x="1054" dy="32">qualified person only.</tspan></text></g><g><rect x="40" y="760" width="1320" height="57.9" rx="10" class="box-warn"></rect><text x="106" y="796.88" class="t-h t-warn t-bold"><tspan x="106" dy="0">Mains voltage can kill — de-energise first</tspan></text><g><path d="M74 770.25 L93.72 804.25 L54.28 804.25 Z" class="tri"></path><rect x="71.96" y="782.1500000000001" width="4.08" height="12.24" rx="2" class="tri-mark"></rect><circle cx="74" cy="799.1500000000001" r="2.3800000000000003" class="tri-mark"></circle></g></g></svg>