<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 858" width="1400" height="858" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Mains-side connection: CT clamp and voltage reference tap</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Mains-side connection: CT clamp and voltage reference tap</tspan></text><g class="rb-box"><rect x="60" y="130" width="140" height="200" rx="10" class="box"></rect><text x="130" y="164.72" class="t-body t-bold" text-anchor="middle" transform="translate(0 72.6)"><tspan x="130" dy="0">Breaker</tspan></text></g><g class="rb-box"><rect x="860" y="130" width="140" height="200" rx="10" class="box"></rect><text x="930" y="164.72" class="t-body t-bold" text-anchor="middle" transform="translate(0 72.6)"><tspan x="930" dy="0">Load</tspan></text></g><g><path d="M200 170 L860 170" class="ln-neutral"></path></g><g><path d="M200 300 L860 300" class="ln-mains"></path></g><text x="210" y="160.88" class="t-h t-neutral t-mono"><tspan x="210" dy="0">N</tspan></text><text x="210" y="290.88" class="t-h t-mains t-mono"><tspan x="210" dy="0">L</tspan></text><g><path d="M400 250 L600 250" class="ln-ok"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah-ok" transform="translate(600 250) rotate(0)"></path></g><text x="500" y="230.48" class="t-small t-ok t-bold" text-anchor="middle"><tspan x="500" dy="0">arrow toward the load</tspan></text><g class="rb-clamp"><circle cx="330" cy="300" r="34" class="clamp" fill="none"></circle><circle cx="330" cy="300" r="21.08" class="clamp" fill="none"></circle><circle cx="310.5262792461225" cy="280.5262792461225" r="5.78" class="clamp" fill="var(--white)"></circle><line x1="343.2228968081884" y1="286.7771031918116" x2="355.7245446995666" y2="274.2754553004334" class="clamp-gap"></line></g><text x="280" y="364.48" class="t-small t-navy t-bold" text-anchor="end"><tspan x="280" dy="0">SCT-013 CT clamp</tspan><tspan x="280" dy="28">(contactless)</tspan></text><text x="390" y="156.48" class="t-small t-neutral t-bold"><tspan x="390" dy="0">N — outside the clamp</tspan></text><g class="rb-box"><rect x="480" y="430" width="500" height="230" rx="10" class="box"></rect><text x="496" y="466.48" class="t-h"><tspan x="496" dy="0">rbAmp module</tspan></text></g><g><rect x="467" y="487" width="26" height="26" rx="4" class="terminal"></rect><circle cx="480" cy="500" r="6" fill="var(--navy)" stroke="none" stroke-width="2"></circle></g><text x="504" y="506.48" class="t-small t-navy t-bold t-mono"><tspan x="504" dy="0">CT jack I0</tspan></text><g><rect x="467" y="553" width="26" height="26" rx="4" class="box-ghost"></rect><circle cx="480" cy="566" r="6" fill="none" stroke="var(--ghost)" stroke-width="2"></circle></g><text x="504" y="572.48" class="t-small t-muted t-mono"><tspan x="504" dy="0">I1 (multi-channel)</tspan></text><g><path d="M330 334 L330 500 L467 500" class="ln-thin"></path></g><g><path d="M270 566 L467 566" class="ln-ghost"></path></g><circle cx="800" cy="300" r="6" class="dot-mains"></circle><circle cx="880" cy="170" r="6" class="dot-neutral"></circle><g><path d="M800 300 L800 430" class="ln-mains"></path></g><rect x="791" y="348" width="18" height="44" rx="3" fill="var(--white)" stroke="var(--mains)" stroke-width="3"></rect><line x1="800" y1="348" x2="800" y2="392" stroke="var(--mains)" stroke-width="3"></line><text x="784" y="368.48" class="t-small t-mains t-bold" text-anchor="end"><tspan x="784" dy="0">fuse the L tap</tspan><tspan x="784" dy="28">per local rules</tspan></text><g><path d="M880 170 L880 288" class="ln-neutral"></path></g><path d="M880 288 A12 12 0 0 0 880 312" class="ln-neutral"></path><g><path d="M880 312 L880 430" class="ln-neutral"></path></g><g><rect x="785" y="415" width="30" height="30" rx="4" class="terminal"></rect><circle cx="800" cy="430" r="7.800000000000001"