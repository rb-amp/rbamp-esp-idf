<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 715" width="1400" height="715" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>Reads auto-increment, writes do not</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">Reads auto-increment, writes do not</tspan></text><g class="rb-box"><rect x="40" y="130" width="1320" height="200" rx="10" class="box-ok"></rect></g><text x="60" y="168.88" class="t-h t-ok"><tspan x="60" dy="0">READ — one burst, auto-increment</tspan></text><path d="M1307 162 L1316.1 171.1 L1333 152.9" class="tick"></path><text x="60" y="198.38" class="t-small t-ink"><tspan x="60" dy="0">set the register pointer once, then read as many bytes as you need</tspan></text><g class="rb-box"><rect x="60" y="250" width="56" height="56" rx="6" class="box-ghost"></rect><text x="88" y="271.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="88" dy="0">S</tspan></text></g><g class="rb-box"><rect x="124" y="250" width="110" height="56" rx="6" class="box-navy"></rect><text x="179" y="271.88" class="t-small t-white t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="179" dy="0">addr W</tspan></text></g><g class="rb-box"><rect x="242" y="250" width="76" height="56" rx="6" class="box-data"></rect><text x="280" y="271.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="280" dy="0">0x68</tspan></text></g><g class="rb-box"><rect x="326" y="250" width="56" height="56" rx="6" class="box-ghost"></rect><text x="354" y="271.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="354" dy="0">Sr</tspan></text></g><g class="rb-box"><rect x="390" y="250" width="110" height="56" rx="6" class="box-navy"></rect><text x="445" y="271.88" class="t-small t-white t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="445" dy="0">addr R</tspan></text></g><g class="rb-box"><rect x="508" y="250" width="76" height="56" rx="6" class="box-white"></rect><text x="546" y="271.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="546" dy="0">b0</tspan></text></g><g class="rb-box"><rect x="592" y="250" width="76" height="56" rx="6" class="box-white"></rect><text x="630" y="271.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="630" dy="0">b1</tspan></text></g><g class="rb-box"><rect x="676" y="250" width="76" height="56" rx="6" class="box-white"></rect><text x="714" y="271.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="714" dy="0">…</tspan></text></g><g class="rb-box"><rect x="760" y="250" width="76" height="56" rx="6" class="box-white"></rect><text x="798" y="271.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="798" dy="0">b7</tspan></text></g><g class="rb-box"><rect x="844" y="250" width="56" height="56" rx="6" class="box-ghost"></rect><text x="872" y="271.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="872" dy="0">P</tspan></text></g><g class="rb-box"><rect x="40" y="360" width="1320" height="260" rx="10" class="box-bad"></rect></g><text x="60" y="398.88" class="t-h t-bad"><tspan x="60" dy="0">WRITE — one byte per transaction</tspan></text><g><path d="M1308 380 L1332 404 M1332 380 L1308 404" class="cross"></path></g><text x="60" y="428.38" class="t-small t-ink"><tspan x="60" dy="0">a burst write delivers only the first byte; bytes 1..N are dropped</tspan></text><g class="rb-box"><rect x="60" y="470" width="56" height="56" rx="6" class="box-ghost"></rect><text x="88" y="491.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="88" dy="0">S</tspan></text></g><g class="rb-box"><rect x="124" y="470" width="110" height="56" rx="6" class="box-navy"></rect><text x="179" y="491.88" class="t-small t-white t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="179" dy="0">addr W</tspan></text></g><g class="rb-box"><rect x="242" y="470" width="76" height="56" rx="6" class="box-data"></rect><text x="280" y="491.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="280" dy="0">0x68</tspan></text></g><g class="rb-box"><rect x="326" y="470" width="76" height="56" rx="6" class="box-white"></rect><text x="364" y="491.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="364" dy="0">b0</tspan></text></g><g class="rb-box"><rect x="410" y="470" width="76" height="56" rx="6" class="box-bad"></rect><text x="448" y="491.88" class="t-small t-bad t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="448" dy="0">b1</tspan></text></g><g><path d="M468 476 L480 488 M480 476 L468 488" class="cross"></path></g><g class="rb-box"><rect x="494" y="470" width="76" height="56" rx="6" class="box-bad"></rect><text x="532" y="491.88" class="t-small t-bad t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="532" dy="0">…</tspan></text></g><g><path d="M552 476 L564 488 M564 476 L552 488" class="cross"></path></g><g class="rb-box"><rect x="578" y="470" width="76" height="56" rx="6" class="box-bad"></rect><text x="616" y="491.88" class="t-small t-bad t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="616" dy="0">b7</tspan></text></g><g><path d="M636 476 L648 488 M648 476 L636 488" class="cross"></path></g><g class="rb-box"><rect x="662" y="470" width="56" height="56" rx="6" class="box-ghost"></rect><text x="690" y="491.88" class="t-small t-navy t-bold t-mono" text-anchor="middle" transform="translate(0 12.5)"><tspan x="690" dy="0">P</tspan></text></g><text x="736" y="504.48" class="t-small t-bad t-bold"><tspan x="736" dy="0">← dropped</tspan></text><text x="60" y="574.48" class="t-small t-navy t-bold t-mono"><tspan x="60" dy="0">write 8 bytes of LABEL = 8 transactions: [S addr W 0x68 b0 P] … [S addr W 0x6F b7 P]</tspan></text><text x="40" y="668.48" class="t-small t-muted"><tspan x="40" dy="0">Example: LABEL, 8 bytes at 0x68..0x6F — read in one burst, write one byte at a time.</tspan></text></svg>