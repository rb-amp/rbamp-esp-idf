<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" width="1400" height="790" class="rb" role="img"><style>svg.rb {  --navy: #00203F;  --mint: #ADEFD1;  --body: #1a2030;  --muted: #8a9ab0;  --box: #f8f9fa;  --border: #dee2e6;  --code: #1e1e1e;  --code-fg:#e8e8e8; --white: #ffffff;  --mains: #c2410c;  --mains-bg: #fff1e8; --neutral: #1d4ed8;  --lv: #00203F;  --data: #0f766e;  --data-bg: #e6f6f2; --warn: #b45309;  --warn-bg: #fff4d6; --ok: #15803d; --ok-bg: #e3f5e8; --bad: #b91c1c; --bad-bg: #fde8e8; --ghost: #c6ccd4;   --font-sans: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; --fs-title: 34px; --fs-sub: 22px; --fs-h: 26px;  --fs-body: 24px;  --fs-small: 21px;  --fs-mono: 22px;  --stroke: 2px;  --wire: 4px;  --wire-thin:2.5px; --radius: 10px; --radius-sm:6px; } svg.rb { font-family: var(--font-sans); font-size: var(--fs-body); fill: var(--body); } svg.rb text { fill: var(--body); font-size: var(--fs-body); white-space: pre; } svg.rb .t-title { font-size: var(--fs-title); font-weight: 600; fill: var(--navy); } svg.rb .t-sub { font-size: var(--fs-sub); fill: var(--muted); } svg.rb .t-h { font-size: var(--fs-h); font-weight: 600; fill: var(--navy); } svg.rb .t-body { font-size: var(--fs-body); fill: var(--body); } svg.rb .t-small { font-size: var(--fs-small); fill: var(--muted); } svg.rb .t-muted { fill: var(--muted); } svg.rb .t-navy { fill: var(--navy); } svg.rb .t-white { fill: var(--white); } svg.rb .t-bold { font-weight: 600; } svg.rb .t-mono { font-family: var(--font-mono); font-size: var(--fs-mono); } svg.rb .t-code { font-family: var(--font-mono); font-size: var(--fs-mono); fill: var(--code-fg); } svg.rb .t-mains { fill: var(--mains); } svg.rb .t-neutral { fill: var(--neutral); } svg.rb .t-data { fill: var(--data); } svg.rb .t-warn { fill: var(--warn); } svg.rb .t-ok { fill: var(--ok); } svg.rb .t-bad { fill: var(--bad); } svg.rb .t-center { text-anchor: middle; } svg.rb .t-right { text-anchor: end; } svg.rb .t-ink { fill: var(--body); }   svg.rb .box { fill: var(--box); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-white { fill: var(--white); stroke: var(--border); stroke-width: var(--stroke); } svg.rb .box-navy { fill: var(--navy); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .box-code { fill: var(--code); stroke: var(--code); stroke-width: var(--stroke); } svg.rb .box-warn { fill: var(--warn-bg); stroke: var(--warn); stroke-width: var(--stroke); } svg.rb .box-ok { fill: var(--ok-bg); stroke: var(--ok); stroke-width: var(--stroke); } svg.rb .box-bad { fill: var(--bad-bg); stroke: var(--bad); stroke-width: var(--stroke); } svg.rb .box-data { fill: var(--data-bg); stroke: var(--data); stroke-width: var(--stroke); } svg.rb .box-mains { fill: var(--mains-bg); stroke: var(--mains); stroke-width: var(--stroke); } svg.rb .box-mint { fill: var(--mint); stroke: var(--mint); stroke-width: var(--stroke); } svg.rb .box-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--stroke); stroke-dasharray: 8 6; } svg.rb .box-dashed { fill: none; stroke: var(--muted); stroke-width: var(--stroke); stroke-dasharray: 10 7; } svg.rb .box-outline{ fill: none; stroke: var(--navy); stroke-width: var(--stroke); }  svg.rb .ln { fill: none; stroke: var(--navy); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-thin { fill: none; stroke: var(--navy); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-muted { fill: none; stroke: var(--muted); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-mains { fill: none; stroke: var(--mains); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-neutral{ fill: none; stroke: var(--neutral); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-data { fill: none; stroke: var(--data); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ok { fill: none; stroke: var(--ok); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-bad { fill: none; stroke: var(--bad); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-warn { fill: none; stroke: var(--warn); stroke-width: var(--wire); stroke-linecap: round; stroke-linejoin: round; } svg.rb .ln-ghost { fill: none; stroke: var(--ghost); stroke-width: var(--wire-thin); stroke-linecap: round; stroke-dasharray: 8 6; } svg.rb .dash { stroke-dasharray: 10 7; } svg.rb .dash-sm { stroke-dasharray: 4 5; }  svg.rb .ah { fill: var(--mint); stroke: var(--navy); stroke-width: 1.5px; stroke-linejoin: round; } svg.rb .ah-navy { fill: var(--navy); stroke: var(--navy); stroke-width: 1.5px; } svg.rb .ah-muted { fill: var(--muted); stroke: var(--muted); } svg.rb .ah-mains { fill: var(--mains); stroke: var(--mains); } svg.rb .ah-neutral{ fill: var(--neutral); stroke: var(--neutral); } svg.rb .ah-data { fill: var(--data); stroke: var(--data); } svg.rb .ah-ok { fill: var(--ok); stroke: var(--ok); } svg.rb .ah-bad { fill: var(--bad); stroke: var(--bad); } svg.rb .ah-warn { fill: var(--warn); stroke: var(--warn); } svg.rb .ah-ghost { fill: var(--ghost); stroke: var(--ghost); }  svg.rb .clamp { fill: var(--white); stroke: var(--navy); stroke-width: var(--wire); } svg.rb .clamp-gap { stroke: var(--white); stroke-width: 6px; } svg.rb .terminal { fill: var(--white); stroke: var(--navy); stroke-width: var(--stroke); } svg.rb .pin { fill: var(--navy); } svg.rb .pin-ghost { fill: var(--ghost); } svg.rb .dot { fill: var(--navy); } svg.rb .dot-mains { fill: var(--mains); } svg.rb .dot-neutral { fill: var(--neutral); } svg.rb .dot-white { fill: var(--white); } svg.rb .dot-mint { fill: var(--mint); } svg.rb .tri { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 3px; stroke-linejoin: round; } svg.rb .tri-mark { fill: var(--warn); } svg.rb .cross { stroke: var(--bad); stroke-width: 5px; stroke-linecap: round; } svg.rb .tick { fill: none; stroke: var(--ok); stroke-width: 5px; stroke-linecap: round; stroke-linejoin: round; } svg.rb .hatch { stroke: var(--ghost); stroke-width: 2px; }</style><title>First reading in eight steps</title><text x="40" y="69.92" class="t-title"><tspan x="40" dy="0">First reading in eight steps</tspan></text><g class="rb-box"><rect x="40" y="140" width="300" height="200" rx="10" class="box-outline"></rect><text x="190" y="207.12" class="t-body" text-anchor="middle" transform="translate(0 23.5)"><tspan x="190" dy="0">Wire: VCC, GND, SDA,</tspan><tspan x="190" dy="32">SCL (+ CT in jack I0,</tspan><tspan x="190" dy="32">clamp on L)</tspan></text></g><g><circle cx="62" cy="162" r="17" class="dot"></circle><text x="62" y="168.48" class="t-small t-white t-bold" text-anchor="middle"><tspan x="62" dy="0">1</tspan></text></g><g class="rb-box"><rect x="380" y="140" width="300" height="200" rx="10" class="box-outline"></rect><text x="530" y="207.12" class="t-body" text-anchor="middle" transform="translate(0 39.5)"><tspan x="530" dy="0">Power on: module</tspan><tspan x="530" dy="32">measures immediately</tspan></text></g><g><circle cx="402" cy="162" r="17" class="dot"></circle><text x="402" y="168.48" class="t-small t-white t-bold" text-anchor="middle"><tspan x="402" dy="0">2</tspan></text></g><g class="rb-box"><rect x="720" y="140" width="300" height="200" rx="10" class="box-outline"></rect><text x="870" y="207.12" class="t-body" text-anchor="middle" transform="translate(0 55.5)"><tspan x="870" dy="0">Scan: 0x50 answers?</tspan></text></g><g><circle cx="742" cy="162" r="17" class="dot"></circle><text x="742" y="168.48" class="t-small t-white t-bold" text-anchor="middle"><tspan x="742" dy="0">3</tspan></text></g><g class="rb-box"><rect x="1060" y="140" width="300" height="200" rx="10" class="box-outline"></rect><text x="1210" y="207.12" class="t-body t-mono" text-anchor="middle" transform="translate(0 55.5)"><tspan x="1210" dy="0">begin()</tspan></text></g><g><circle cx="1082" cy="162" r="17" class="dot"></circle><text x="1082" y="168.48" class="t-small t-white t-bold" text-anchor="middle"><tspan x="1082" dy="0">4</tspan></text></g><g class="rb-box"><rect x="1060" y="470" width="300" height="200" rx="10" class="box-dashed"></rect><text x="1210" y="537.12" class="t-body" text-anchor="middle" transform="translate(0 7.5)"><tspan x="1210" dy="0">SCT-013?</tspan><tspan x="1210" dy="32">setSensorClass +</tspan><tspan x="1210" dy="32">setCTModel (code</tspan><tspan x="1210" dy="32">1..7)</tspan></text></g><g><circle cx="1082" cy="492" r="17" class="pin-ghost"></circle><text x="1082" y="498.48" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="1082" dy="0">5</tspan></text></g><g class="rb-box"><rect x="720" y="470" width="300" height="200" rx="10" class="box-outline"></rect><text x="870" y="537.12" class="t-body" text-anchor="middle" transform="translate(0 55.5)"><tspan x="870" dy="0">Read U, I, P, PF</tspan></text></g><g><circle cx="742" cy="492" r="17" class="dot"></circle><text x="742" y="498.48" class="t-small t-white t-bold" text-anchor="middle"><tspan x="742" dy="0">6</tspan></text></g><g class="rb-box"><rect x="380" y="470" width="300" height="218.70000000000002" rx="10" class="box-dashed"></rect><text x="530" y="537.12" class="t-body" text-anchor="middle"><tspan x="530" dy="0">Sanity: resistive load</tspan><tspan x="530" dy="32">→ P &gt; 0, PF ≈ 1; else</tspan><tspan x="530" dy="32">turn the clamp around</tspan><tspan x="530" dy="32">(arrow toward the</tspan><tspan x="530" dy="32">load)</tspan></text></g><g><circle cx="402" cy="492" r="17" class="pin-ghost"></circle><text x="402" y="498.48" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="402" dy="0">7</tspan></text></g><g class="rb-box"><rect x="40" y="470" width="300" height="200" rx="10" class="box-dashed"></rect><text x="190" y="537.12" class="t-body" text-anchor="middle" transform="translate(0 23.5)"><tspan x="190" dy="0">Energy: first latch =</tspan><tspan x="190" dy="32">primer; wait one</tspan><tspan x="190" dy="32">period for the first Wh</tspan></text></g><g><circle cx="62" cy="492" r="17" class="pin-ghost"></circle><text x="62" y="498.48" class="t-small t-navy t-bold" text-anchor="middle"><tspan x="62" dy="0">8</tspan></text></g><g><path d="M340 240 L380 240" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(380 240) rotate(0)"></path></g><g><path d="M680 240 L720 240" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(720 240) rotate(0)"></path></g><g><path d="M1020 240 L1060 240" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(1060 240) rotate(0)"></path><rect x="1015.8077758789062" y="202.7" width="48.3844482421875" height="33.3" rx="5" fill="var(--white)" opacity="0.9"></rect><text x="1040" y="224.17999999999998" class="t-small t-navy" text-anchor="middle"><tspan x="1040" dy="0">yes</tspan></text></g><g><path d="M1210 340 L1210 470" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(1210 470) rotate(90)"></path></g><g><path d="M1060 570 L1020 570" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(1020 570) rotate(180)"></path></g><g><path d="M720 570 L680 579.35" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(680 579.35) rotate(166.84333919483583)"></path></g><g><path d="M380 579.35 L340 570" class="ln"></path><path d="M0 0 L-16 -8 L-11.52 0 L-16 8 Z" class="ah" transform="translate(340 570) rotate(-166.84333919483583)"></path></g><g class="rb-box"><rect x="720" y="370" width="300" height="88.40000000000005" rx="10" class="box-bad"></rect><text x="870" y="404.72" class="t-body" text-anchor="middle"><tspan x="870" dy="0">NACK